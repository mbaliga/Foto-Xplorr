org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The Kotlin compiler runs in its own daemon. One screen's Compose function compiles to a method with
# about 240 locals, and generating it for the Connect release variant ran the 3 GB default out of memory
# on the CI runner (the debug and Offline builds fit). Give the compiler its own, larger heap.
kotlin.daemon.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
