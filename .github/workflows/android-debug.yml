name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # hyle-design-system is a git submodule (D-A); without this the includeBuild()
          # in settings.gradle.kts resolves to an empty directory and configuration fails.
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        # No explicit gradle-version: the checked-in wrapper (gradle/wrapper/gradle-wrapper.properties,
        # 8.14.3) is now the single source of truth for the Gradle version, so it stays in
        # lockstep with hyle-design-system's own wrapper and with the AGP 8.9.1 pin in the
        # root build.gradle.kts (D-Q: composite builds require identical AGP versions
        # across the root build and any includeBuild'd project).
      - name: Test, lint and build debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew scripts/verify.sh
          # CI runs the SAME script as local development (FX-002): scripts/verify.sh is
          # the one definition of "builds clean", so the two gates cannot drift apart.
          # (lintDebug lives in that script for the same reason it was added here: it was
          # once absent from CI, a lint error sat on a branch unnoticed, and "lint passes"
          # became a claim rather than a gate.)
          ./scripts/verify.sh 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foto-xplorr-build-log
          path: build.log
          if-no-files-found: error
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foto-xplorr-lint
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foto-xplorr-unit-tests
          path: app/build/reports/tests/
          if-no-files-found: warn
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          # Both flavors: offline is the app's identity (and keeps the historical
          # com.fotoxplorr.app.debug id); connect installs beside it as .connect.
          name: foto-xplorr-debug
          path: |
            app/build/outputs/apk/offline/debug/app-offline-debug.apk
            app/build/outputs/apk/connect/debug/app-connect-debug.apk
          if-no-files-found: error

      # The debug APK above is ~187 MB, and the artifact holding both flavours is a ~225 MB
      # download. That is a genuinely bad way to hand someone a build to try on a phone, so the
      # sideloading path gets its own minified, resource-shrunk, per-ABI build. The release
      # workflow publishes these to a Release when a tag is cut; this makes the same files
      # available from an ordinary PR run, which is where they are actually wanted.
      # The release build signs with the debug keystore so the artifact is installable. AGP
      # generates that keystore on demand during a debug build, and verify.sh above happens to do
      # one — but relying on a side effect of another step's ordering is exactly the kind of
      # dependency that breaks silently later, so it is made explicit here.
      - name: Ensure debug keystore exists
        shell: bash
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APKs for sideloading
        shell: bash
        run: ./gradlew :app:assembleOfflineRelease -PabiSplits=true

      # TRAPS #16 / WP1.9: a read-only regression guard -- AGP already produces 16 KB-aligned
      # output by default, this only catches a future change that breaks it.
      - name: Verify 16 KB page alignment
        shell: bash
        run: |
          chmod +x scripts/verify-page-alignment.sh
          ./scripts/verify-page-alignment.sh app/build/outputs/apk/offline/release/*.apk

      # Uploaded as SEPARATE artifacts, one per architecture, because GitHub zips an artifact
      # whole: bundling four ABIs would put the size straight back. arm64-v8a is the only one
      # any current phone needs — it is the file to click.
      - name: Upload arm64 release APK (most phones want this one)
        uses: actions/upload-artifact@v4
        with:
          name: fotoxplorr-arm64-INSTALL-THIS
          path: app/build/outputs/apk/offline/release/app-offline-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload other release APKs
        uses: actions/upload-artifact@v4
        with:
          name: fotoxplorr-release-other-abis
          path: |
            app/build/outputs/apk/offline/release/app-offline-armeabi-v7a-release.apk
            app/build/outputs/apk/offline/release/app-offline-x86_64-release.apk
          if-no-files-found: warn

  # WP1.9 (ADR-009 decision 5), "required once WP1.2 lands" -- WP1.2 has landed every
  # :core:* module this job covers. Separate from `build` above rather than folded into it:
  # this only needs the :core:* modules and their native targets, not the whole app/lint/test
  # matrix, and keeping it a distinct job means a native-only failure shows up as its own red
  # check instead of being buried inside `build`'s much longer log.
  core-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test every native-ready :core:* module
        shell: bash
        run: |
          chmod +x ./gradlew scripts/verify-native.sh
          # scripts/verify-native.sh is the one definition of the native task list (FX-002) --
          # `./scripts/verify.sh --native` calls the exact same script.
          ./scripts/verify-native.sh
