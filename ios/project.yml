# XcodeGen spec -> ios/Fotoz.xcodeproj (generated in CI and locally; the .xcodeproj is not committed).
#   brew install xcodegen && cd ios && xcodegen generate
# Prerequisite: the Kotlin framework, built on a Mac:
#   ./gradlew -Pfotoz.ios=true :ios:core:assembleFotozCoreReleaseXCFramework
name: Fotoz
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: $(FOTOZ_MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: $(FOTOZ_BUILD_NUMBER)
    DEVELOPMENT_TEAM: $(FOTOZ_TEAM_ID)
    # Unsigned by default; the signed export lane overrides these on the command line.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
packages:
  FotozKit:
    path: FotozKit
targets:
  Fotoz:
    type: application
    platform: iOS
    sources:
      - path: Fotoz
    dependencies:
      - package: FotozKit
      # Static framework: link only, never embed (nothing to dlopen, nothing to codesign separately).
      - framework: core/build/XCFrameworks/release/FotozCore.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FOTOZ_BUNDLE_ID)
        PRODUCT_NAME: Fotoz
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Fotoz/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    info:
      path: Fotoz/Info.plist
      properties:
        CFBundleDisplayName: $(FOTOZ_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: >-
          Fotoz shows and searches the photos on this device. Nothing is uploaded: Fotoz has no
          network code at all, and reads your library only to display it.
        # No network encryption of our own (there is no network code); only OS-provided crypto, if any.
        ITSAppUsesNonExemptEncryption: false
  FotozTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FotozTests
      # The shared Swift<->Kotlin contract files, read by the real-framework smoke test.
      - path: contract
        type: folder
        buildPhase: resources
    dependencies:
      - target: Fotoz
      - package: FotozKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: $(FOTOZ_BUNDLE_ID).tests
schemes:
  Fotoz:
    build:
      targets:
        Fotoz: all
    test:
      targets:
        - FotozTests
    archive:
      config: Release
